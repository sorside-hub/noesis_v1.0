<!doctype html>

    <title>Noesis — AI Second Brain & PKM Vault</title>
    <meta name="description" content="Offline-first Personal Knowledge Management & Second Brain powered by local AI." />
    
    <!-- PWA Primary & Theme Colors -->
    <meta name="theme-color" content="#262626" />
    <meta name="background-color" content="#262626" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="alternate icon" type="image/png" href="/pwa-maskable-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-maskable-512x512.png" />

    <!-- Open Graph -->

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Early ResizeObserver benign notification interceptor & safe batching wrapper -->
    <script>
      (function() {
        var isResizeObserverError = function(e) {
          if (!e) return false;
          var msg = typeof e === 'string' ? e : (e.message || (e.reason && (e.reason.message || String(e.reason))) || '');
          return /ResizeObserver loop (completed with undelivered notifications|limit exceeded)/i.test(msg);
        };

        window.addEventListener('error', function(event) {
          if (isResizeObserverError(event.message) || isResizeObserverError(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isResizeObserverError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        if (typeof window.ResizeObserver !== 'undefined') {
          var OriginalResizeObserver = window.ResizeObserver;
          window.ResizeObserver = class PatchedResizeObserver extends OriginalResizeObserver {
            constructor(callback) {
              super(function(entries, observer) {
                window.requestAnimationFrame(function() {
                  try {
                    callback(entries, observer);
                  } catch (err) {
                    if (!isResizeObserverError(err)) {
                      console.error(err);
                    }
                  }
                });
              });
            }
          };
        }
      })();
    </script>

    <!-- Default Unified Dark Theme Script -->
    <script>
      (function() {
        try {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'charcoal-navy');
          localStorage.setItem('noesis_theme_mode', 'charcoal-navy');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased select-none overflow-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Noesis PWA ServiceWorker active:', reg.scope))
            .catch((err) => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
